<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natal - Contagem Regressiva 🎅✨</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        xmasRed: '#E63946',
                        xmasDarkRed: '#900C3F',
                        xmasGreen: '#2A9D8F',
                        xmasBrightGreen: '#25A244',
                        xmasDarkGreen: '#1B4332',
                        xmasGold: '#FFD700',
                        xmasOrange: '#F4A261'
                    },
                    fontFamily: {
                        festive: ['"Fredoka One"', 'cursive'],
                        christmas: ['"Mountains of Christmas"', 'cursive'],
                        body: ['"Poppins"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Mountains+of+Christmas:wght@700&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome para ícones adicionais -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Estilos Externos -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex flex-col min-h-screen justify-between items-center select-none pb-12 pt-6">

    <!-- Canvas de Neve e Brilhos -->
    <canvas id="snowCanvas"></canvas>

    <!-- Pisca-Pisca de Natal no Topo -->
    <div class="light-string" id="lightString"></div>

    <!-- Papai Noel Voando com Trenó -->
    <div class="santa-fly">
        <div class="sparkle-trail"></div>
        <svg width="260" height="90" viewBox="0 0 300 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Trenó Dourado Vermelho -->
            <path d="M20 60 C 40 85, 90 85, 110 55 L 125 55 C 135 55, 140 45, 130 35 L 70 35 Z" fill="#E63946" stroke="#FFD700" stroke-width="4"/>
            <path d="M10 75 L 145 75 C 155 75, 160 65, 150 55" stroke="#FFD700" stroke-width="5" stroke-linecap="round"/>
            <path d="M40 55 L 40 75 M 100 55 L 100 75" stroke="#FFD700" stroke-width="4"/>
            <!-- Papai Noel -->
            <circle cx="75" cy="30" r="14" fill="#FFCC99"/> <!-- Rosto -->
            <path d="M55 32 Q 75 58 95 32 Z" fill="#FFFFFF"/> <!-- Barba -->
            <path d="M58 20 Q 75 -5 92 20 Z" fill="#E63946"/> <!-- Gorro -->
            <circle cx="92" cy="18" r="5" fill="#FFFFFF"/> <!-- Pom-pom -->
            <circle cx="82" cy="26" r="2.5" fill="#000"/> <!-- Olho -->
            <circle cx="87" cy="30" r="3" fill="#E63946"/> <!-- Nariz -->
            <!-- Rédeas de Luz -->
            <path d="M110 40 L 190 35 L 250 30" stroke="#FFD700" stroke-width="2" stroke-dasharray="4 2"/>
            <!-- Renas -->
            <g fill="#8D5B4C">
                <!-- Rena 1 -->
                <ellipse cx="195" cy="40" rx="16" ry="9"/>
                <circle cx="210" cy="30" r="6"/>
                <path d="M210 24 L 216 14 M 208 24 L 202 16" stroke="#5C3D2E" stroke-width="2"/>
                <!-- Rena Guia (Rudolph) -->
                <ellipse cx="255" cy="35" rx="16" ry="9"/>
                <circle cx="270" cy="25" r="6"/>
                <path d="M270 19 L 276 9 M 268 19 L 262 11" stroke="#5C3D2E" stroke-width="2"/>
                <circle cx="275" cy="25" r="3.5" fill="#FF0000"/> <!-- Nariz Vermelho Brilhante -->
            </g>
        </svg>
    </div>

    <!-- Header com Animação e Título Festivo -->
    <header class="w-full text-center px-4 z-20 mt-8">
        <!-- Badge animada -->
        <div class="inline-flex items-center gap-2 bg-gradient-to-r from-xmasRed via-xmasGold to-xmasBrightGreen text-xmasDarkGreen px-6 py-2 rounded-full font-bold text-sm md:text-base shadow-lg animate-bounce mb-3">
            <i class="fa-solid fa-bell text-xmasRed"></i>
            <span>ENTRE NO CLIMA DE FESTA!</span>
            <i class="fa-solid fa-holly-berry text-xmasBrightGreen"></i>
        </div>

        <h1 class="font-christmas text-5xl sm:text-7xl lg:text-8xl text-xmasGold drop-shadow-[0_5px_15px_rgba(230,57,70,0.8)] tracking-wide">
            Natal
        </h1>
        <p class="font-festive text-xmasOrange text-lg md:text-2xl tracking-wider uppercase mt-1 drop-shadow">
            🎄 A Contagem Regressiva Começou! 🎁
        </p>
    </header>

    <!-- Conteúdo Central: Cronômetro de Presentes -->
    <main class="w-full max-w-5xl px-4 my-auto z-20 flex flex-col items-center gap-8">
        
        <!-- Grid de Cards Estilo Caixa de Presente -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6 w-full">
            
            <!-- DIAS -->
            <div class="gift-card rounded-3xl p-3 sm:p-5 text-center">
                <div class="card-content py-4 px-2">
                    <span id="days" class="font-festive text-5xl sm:text-7xl font-bold text-white drop-shadow-[0_4px_8px_rgba(0,0,0,0.8)] tracking-wider block">00</span>
                    <span class="text-xmasGold font-festive uppercase tracking-widest text-xs sm:text-sm mt-2 block">
                        <i class="fa-solid fa-calendar-day text-xmasRed mr-1"></i> Dias
                    </span>
                </div>
            </div>

            <!-- HORAS -->
            <div class="gift-card rounded-3xl p-3 sm:p-5 text-center">
                <div class="card-content py-4 px-2">
                    <span id="hours" class="font-festive text-5xl sm:text-7xl font-bold text-white drop-shadow-[0_4px_8px_rgba(0,0,0,0.8)] tracking-wider block">00</span>
                    <span class="text-xmasGold font-festive uppercase tracking-widest text-xs sm:text-sm mt-2 block">
                        <i class="fa-solid fa-clock text-xmasRed mr-1"></i> Horas
                    </span>
                </div>
            </div>

            <!-- MINUTOS -->
            <div class="gift-card rounded-3xl p-3 sm:p-5 text-center">
                <div class="card-content py-4 px-2">
                    <span id="minutes" class="font-festive text-5xl sm:text-7xl font-bold text-white drop-shadow-[0_4px_8px_rgba(0,0,0,0.8)] tracking-wider block">00</span>
                    <span class="text-xmasGold font-festive uppercase tracking-widest text-xs sm:text-sm mt-2 block">
                        <i class="fa-solid fa-hourglass-start text-xmasRed mr-1"></i> Minutos
                    </span>
                </div>
            </div>

            <!-- SEGUNDOS -->
            <div class="gift-card rounded-3xl p-3 sm:p-5 text-center">
                <div class="card-content py-4 px-2">
                    <span id="seconds" class="font-festive text-5xl sm:text-7xl font-bold text-xmasGold animate-pulse drop-shadow-[0_4px_8px_rgba(0,0,0,0.8)] tracking-wider block">00</span>
                    <span class="text-xmasGold font-festive uppercase tracking-widest text-xs sm:text-sm mt-2 block">
                        <i class="fa-solid fa-bolt text-xmasRed mr-1"></i> Segundos
                    </span>
                </div>
            </div>

        </div>

        <!-- Banner de Decoração com Árvores e Mensagem -->
        <div class="w-full bg-gradient-to-r from-xmasDarkGreen/90 via-xmasDarkRed/80 to-xmasDarkGreen/90 border-4 border-xmasGold/60 rounded-3xl p-6 text-center shadow-2xl relative overflow-hidden backdrop-blur-md flex flex-col md:flex-row items-center justify-between gap-4">
            
            <!-- Árvore de Natal Esquerda -->
            <div class="tree-bounce hidden md:block">
                <svg width="70" height="90" viewBox="0 0 100 120">
                    <polygon points="50,10 20,50 35,50 10,80 30,80 0,110 100,110 70,80 90,80 65,50 80,50" fill="#25A244"/>
                    <rect x="42" y="110" width="16" height="15" fill="#5C3D2E"/>
                    <circle cx="50" cy="10" r="6" fill="#FFD700"/>
                    <!-- Luzes -->
                    <circle cx="35" cy="65" r="4" fill="#FF2A2A" class="animate-ping"/>
                    <circle cx="65" cy="90" r="4" fill="#FFD700" class="animate-ping"/>
                    <circle cx="50" cy="40" r="4" fill="#00E5FF" class="animate-ping"/>
                </svg>
            </div>

            <!-- Mensagem Natalina -->
            <div class="flex-1">
                <p id="christmasMessage" class="font-christmas text-3xl sm:text-4xl text-xmasGold drop-shadow-md">
                    "Que a magia do Natal ilumine sua vida com amor, saúde e realizações!" ✨
                </p>
                <p id="targetDateText" class="text-xs sm:text-sm text-white/80 font-bold uppercase tracking-widest mt-2">
                    Ajustando contagem...
                </p>
            </div>

            <!-- Árvore de Natal Direita -->
            <div class="tree-bounce hidden md:block">
                <svg width="70" height="90" viewBox="0 0 100 120">
                    <polygon points="50,10 20,50 35,50 10,80 30,80 0,110 100,110 70,80 90,80 65,50 80,50" fill="#25A244"/>
                    <rect x="42" y="110" width="16" height="15" fill="#5C3D2E"/>
                    <circle cx="50" cy="10" r="6" fill="#FFD700"/>
                    <circle cx="60" cy="60" r="4" fill="#FF2A2A" class="animate-ping"/>
                    <circle cx="35" cy="95" r="4" fill="#FFD700" class="animate-ping"/>
                </svg>
            </div>
        </div>

        <!-- Botão Áudio Super Animado -->
        <button id="musicToggleBtn" class="music-pulse flex items-center gap-4 bg-gradient-to-r from-xmasGold via-yellow-300 to-xmasGold text-xmasDarkRed font-festive text-lg sm:text-xl px-8 py-4 rounded-full transition-all duration-300 transform hover:scale-110 active:scale-95 shadow-[0_10px_25px_rgba(255,215,0,0.5)] border-4 border-white cursor-pointer">
            <i id="musicIcon" class="fa-solid fa-music text-2xl"></i>
            <span id="musicBtnText">LIGAR MÚSICA DE NATAL 🎵</span>
        </button>

    </main>

    <!-- Boneco de Neve Simpático Animado no Canto -->
    <div class="snowman-container hidden sm:block">
        <svg width="120" height="150" viewBox="0 0 140 180" fill="none">
            <!-- Braço Esquerdo Acenando -->
            <g class="snowman-arm-left">
                <path d="M40 90 L10 75 M10 75 L5 65 M10 75 L0 80" stroke="#5C3D2E" stroke-width="4" stroke-linecap="round"/>
            </g>
            <!-- Braço Direito -->
            <path d="M100 90 L130 100 M130 100 L138 95 M130 100 L135 108" stroke="#5C3D2E" stroke-width="4" stroke-linecap="round"/>
            <!-- Corpo de Neve -->
            <circle cx="70" cy="130" r="38" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3"/> <!-- Base -->
            <circle cx="70" cy="85" r="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3"/>  <!-- Meio -->
            <circle cx="70" cy="48" r="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3"/>  <!-- Cabeça -->
            <!-- Botões -->
            <circle cx="70" cy="78" r="3.5" fill="#000"/>
            <circle cx="70" cy="92" r="3.5" fill="#000"/>
            <circle cx="70" cy="120" r="4" fill="#000"/>
            <!-- Rosto -->
            <circle cx="63" cy="44" r="2.5" fill="#000"/> <!-- Olho L -->
            <circle cx="77" cy="44" r="2.5" fill="#000"/> <!-- Olho R -->
            <polygon points="70,48 88,52 70,54" fill="#F4A261"/> <!-- Nariz de Cenoura -->
            <path d="M62 58 Q 70 65 78 58" stroke="#000" stroke-width="2" fill="none"/> <!-- Sorriso -->
            <!-- Cachecol Vermelho -->
            <path d="M52 64 Q 70 72 88 64 L 85 85 L 75 85 Z" fill="#E63946"/>
            <!-- Cartola -->
            <rect x="50" y="28" width="40" height="6" fill="#1A202C" rx="2"/>
            <rect x="56" y="8" width="28" height="22" fill="#1A202C" rx="2"/>
            <rect x="56" y="24" width="28" height="4" fill="#E63946"/>
        </svg>
    </div>

    <!-- Presentes Decorativos no Canto Esquerdo -->
    <div class="fixed bottom-3 left-3 z-20 hidden sm:block pointer-events-none">
        <svg width="100" height="90" viewBox="0 0 120 100">
            <!-- Caixas de presentes empilhadas -->
            <rect x="10" y="40" width="50" height="50" fill="#E63946" rx="6"/>
            <rect x="30" y="40" width="10" height="50" fill="#FFD700"/>
            <rect x="60" y="20" width="50" height="70" fill="#25A244" rx="6"/>
            <rect x="80" y="20" width="10" height="70" fill="#E63946"/>
        </svg>
    </div>

    <!-- Rodapé Festivo -->
    <footer class="w-full text-center z-20 text-xs sm:text-sm text-xmasGold/90 font-bold tracking-wider">
        <p>🎅 Boas Festas! Viva a magia do Natal todos os dias! 🎄</p>
    </footer>

    <!-- Script Externo -->
    <script src="script.js"></script>
</body>
</html>
